name: linter
description: Checks the code for linting errors
inputs:
  node-version:
    description: 'The version of Node.js to use'
    default: "24"
  package-manager:
    description: 'The package manager to use'
    default: "pnpm"
  pnpm-version:
    description: 'The version of pnpm to use when package.json does not pin one (only applies if package-manager is pnpm)'
    default: "8"
  install-options:
    description: 'The options to pass to the package manager install command'
    default: "--ignore-scripts"
  lint-options:
    description: 'The options to pass to the package manager lint command'
    default: ""
runs:
  using: composite
  steps:
    - name: Resolve pnpm version
      id: pnpm
      if: ${{ inputs.package-manager == 'pnpm' }}
      # A version pinned in package.json wins; passing a second one makes pnpm/action-setup fail
      run: |
        if grep -q '"packageManager": *"pnpm@' package.json 2>/dev/null; then
          echo "version=" >> "$GITHUB_OUTPUT"
        else
          echo "version=${{ inputs.pnpm-version }}" >> "$GITHUB_OUTPUT"
        fi
      shell: bash

    - name: Install pnpm
      if: ${{ inputs.package-manager == 'pnpm' }}
      uses: pnpm/action-setup@v6
      with:
        version: ${{ steps.pnpm.outputs.version }}
    
    - name: Install Node.js and setup dependency caching
      if: ${{ inputs.package-manager != 'bun' }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}.x
        cache: '${{ inputs.package-manager }}'

    - name: Install Bun 1.0
      if: ${{ inputs.package-manager == 'bun' }}
      uses: akalanka47000/setup-bun@v1.2
      with:
        bun-version: 1.0.20
        no-cache: true
    
    - name: Install dependencies
      run: ${{ inputs.package-manager }} install ${{ inputs.install-options }}
      shell: bash

    - name: Run linter
      run: ${{ inputs.package-manager }} run lint ${{ inputs.lint-options }}
      shell: bash
